# cargo-deny configuration. CI runs `cargo deny check advisories` and
# `cargo deny check licenses`; the duplicate-version (`bans`) and `sources`
# checks are not enforced yet.
[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Every license expression in the dependency tree must be satisfiable by this
# list. `cargo deny check licenses` reports the offending crate when it is not;
# add the license here (with a comment on which crate needs it) rather than
# adding an exception for the crate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",       # subtle, ring
    "BSL-1.0",            # ryu (dual with Apache-2.0)
    "CC0-1.0",            # notify-types
    "CDLA-Permissive-2.0", # webpki-root-certs (Mozilla root store)
    "ISC",                # rustls-webpki, untrusted, simple_asn1, ring
    "MPL-2.0",            # progenitor (client code generator; used as a dependency, not modified)
    "Unicode-3.0",        # icu_* and friends pulled in by url/idna
    "Unlicense",          # byteorder, memchr and other BurntSushi crates (dual with MIT)
    "Zlib",               # foldhash, zlib-rs
]
confidence-threshold = 0.8
