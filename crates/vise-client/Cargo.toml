[package]
name = "vise-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Generated at build time from ../../openapi/openapi.json, which is outside the
# crate; it cannot be packaged for crates.io as-is.
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.9"
chrono = { version = "0.4", default-features=false, features = ["serde"] }
futures-core = "0.3"
progenitor-client = "0.15.0"
reqwest = { version = "0.13", default-features=false, features = ["json", "query", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

[build-dependencies]
openapiv3 = "2"
prettyplease = "0.3"
progenitor = "0.15.0"
serde_json = "1"
syn = { version = "3", features = ["full"] }

