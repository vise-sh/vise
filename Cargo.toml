[workspace]
members = [
    "bins/*",
    "crates/*",
]
resolver = "2"

# Keys shared by every crate via `<key>.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vise-sh/vise"

# Shared lint configuration. Every crate opts in with `[lints] workspace = true`.
# Clippy runs with `-D warnings` in CI (see `just lint`), so anything that
# warns here fails the build. Prefer fixing over `#[allow]`; if you must allow,
# scope it narrowly and leave a comment saying why.
[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.31"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
    "json",
] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.17"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }

vise-api = { path = "crates/vise-api" }
vise-client = { path = "crates/vise-client" }
vise-core = { path = "crates/vise-core" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
