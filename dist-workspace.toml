[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. Shell installer and Homebrew
# formula are intentionally off for now; only release archives are published.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Extra publish step run by release.yml after the archives are built: the
# reusable workflow .github/workflows/publish-docker.yml pushes the
# vise-server container image to ghcr.io for the same tag.
publish-jobs = ["./publish-docker"]
# The default custom-publish permissions (id-token + packages) drop
# `contents`, which actions/checkout needs on a private repository.
github-custom-job-permissions = { "publish-docker" = { contents = "read", packages = "write" } }
# Tags are created by release-plz (see release-plz.toml); this workflow only
# builds on tag push, it never tags or bumps versions itself.
# release.yml carries one hand-written step (the SHA256SUMS.txt release
# asset); without this, dist refuses to build because the generated CI file
# no longer matches its template. Re-apply that step after `dist generate`.
allow-dirty = ["ci"]

