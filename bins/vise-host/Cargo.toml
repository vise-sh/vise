[package]
name = "vise-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Deployable agent runtime, not a library; distributed via GitHub releases only.
publish = false

# `publish = false` would otherwise exclude this package from cargo-dist; the
# install script (scripts/install.sh) downloads the vise-host archive from the
# GitHub release alongside vise-cli.
[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
agent-client-protocol = "2.1.0"
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vise-client = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tempfile = "3"
wiremock = "0.6"
