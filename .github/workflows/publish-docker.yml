# Publishes the vise-server container image for a release.
#
# Not triggered directly: release.yml (generated by dist) calls this workflow
# as a custom publish job once the release archives for a tag are built and
# uploaded (see `publish-jobs` in dist-workspace.toml). It runs with the
# permissions dist grants that job (contents: read, packages: write) and the
# repository's GITHUB_TOKEN, which is enough to push to ghcr.io under the
# repository owner.
#
# The image is built for linux/amd64 and linux/arm64 (the Dockerfile
# cross-compiles, so no QEMU) and tagged with the release version and
# `latest`. Pre-releases never reach here; dist skips publish jobs for them.
#
# After the push, the multi-arch manifest is signed by digest with cosign in
# keyless mode: the job's GitHub Actions OIDC token (hence `id-token: write`)
# is exchanged for a short-lived Sigstore certificate, so there is no signing
# key to store or rotate. The signature is stored next to the image in
# ghcr.io and the certificate is recorded in the public Rekor transparency
# log. SECURITY.md documents how to verify it.
#
# Finally the job checks that the image can be pulled anonymously
# (scripts/check-image-public.sh). GHCR makes a package private on its first
# push and offers no API to change that, so a maintainer switches it to public
# once in the package settings (see CONTRIBUTING.md, "Container image").
# scripts/install.sh pulls without credentials, so a private package breaks
# every install; better to fail the release loudly here. Between releases,
# image-public.yml repeats the check on a schedule.
name: Publish vise-server image

on:
  workflow_call:
    inputs:
      plan:
        description: The dist-manifest.json produced by the release plan job.
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vise-server

jobs:
  publish:
    name: Build and push ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `v0.1.0` -> `0.1.0`, plus `latest` for any non-prerelease version.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ fromJson(inputs.plan).announcement_tag }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      # Sign the pushed manifest list by digest rather than by tag, so the
      # signature is bound to exactly what was built even if a tag (`latest`)
      # is later moved. Both the version tag and `latest` resolve to this
      # digest, so one signature covers them. `--yes` skips the interactive
      # confirmation for uploading to the transparency log.
      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Same anonymous token dance a `docker pull` does for a public image;
      # image-public.yml runs the same script between releases.
      - name: Check the image can be pulled anonymously
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SETTINGS_URL: https://github.com/orgs/${{ github.repository_owner }}/packages/container/vise-server/settings
        run: |
          if ! scripts/check-image-public.sh "${IMAGE}@${DIGEST}"; then
            echo "::error::${IMAGE} cannot be pulled anonymously: the GHCR package is private. Change its visibility to public at ${SETTINGS_URL} (CONTRIBUTING.md, 'Container image') and re-run this job."
            exit 1
          fi
