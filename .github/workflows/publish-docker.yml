# Publishes the vise-server container image for a release.
#
# Not triggered directly: release.yml (generated by dist) calls this workflow
# as a custom publish job once the release archives for a tag are built and
# uploaded (see `publish-jobs` in dist-workspace.toml). It runs with the
# permissions dist grants that job (contents: read, packages: write) and the
# repository's GITHUB_TOKEN, which is enough to push to ghcr.io under the
# repository owner.
#
# The image is built for linux/amd64 and linux/arm64 (the Dockerfile
# cross-compiles, so no QEMU) and tagged with the release version and
# `latest`. Pre-releases never reach here; dist skips publish jobs for them.
name: Publish vise-server image

on:
  workflow_call:
    inputs:
      plan:
        description: The dist-manifest.json produced by the release plan job.
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vise-server

jobs:
  publish:
    name: Build and push ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `v0.1.0` -> `0.1.0`, plus `latest` for any non-prerelease version.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ fromJson(inputs.plan).announcement_tag }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
