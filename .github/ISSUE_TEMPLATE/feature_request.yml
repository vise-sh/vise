name: Feature request
description: Suggest a new capability or a change to existing behaviour.
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describing the *problem* you are trying to
        solve is more useful to us than a specific implementation; we may know
        of constraints that make a different solution better.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: "When I ..., I have to ... because vise does not ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? CLI flags, API shape, config, example output, anything that makes the idea concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried or thought about, and why they are not sufficient.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to related issues, prior discussion, or comparable features in other tools.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: I am willing to open a pull request for this (optional, but good to know).
