services:
  postgres:
    image: postgres:17
    container_name: vise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vise
    ports:
      - "5432:5432"
    volumes:
      - vise-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vise-postgres-data:
